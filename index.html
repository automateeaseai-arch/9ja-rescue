<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1410" />
    <title>9ja Rescue</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="loading">
      <div class="title">9ja Rescue</div>
      <div class="bar"><div id="loading-fill"></div></div>
      <div id="loading-text">Loading…</div>
    </div>

    <div id="hud" hidden>
      <div class="objective">Prototype: explore the savanna village</div>
      <button id="switch-char" type="button">Switch character</button>
    </div>

    <div id="help" hidden>
      <span class="desktop-only">WASD move · Shift run · Space jump · hold F or right mouse to fire · drag to look</span>
      <span class="touch-only">Left thumb: move (push far to run) · Right side: swipe to look · hold Fire to shoot</span>
    </div>

    <div id="joystick" hidden><div id="joystick-knob"></div></div>
    <button id="jump-btn" type="button" hidden>Jump</button>
    <button id="fire-btn" type="button" hidden>Fire</button>

    <div id="rotate">
      <div>Rotate your phone to continue</div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
